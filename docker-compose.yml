services:
  backend:
    build:
      context: ./backend
    container_name: patientportal-backend
    environment:
      PATIENTPORTAL_JWT_SECRET: change-this-in-production
      PATIENTPORTAL_JWT_EXPIRATION_MINUTES: "30"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: patientportal-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
